<style>
  :root {

      --bg: #14171a;
      --surface: #1b1f23;
      --border: #2a2f34;
      --border-strong: #383e44;
      --text: #e8e9ea;
      --muted: #9198a1;
      --accent: #7c94ff;
      --accent-soft: rgba(124, 148, 255, 0.14);
      --mono-tag: #9198a1;
      --good: #4ade80;
      --good-soft: rgba(74, 222, 128, 0.12);
      --bad: #f87171;
      --bad-soft: rgba(248, 113, 113, 0.12);
      --pending: #fbbf24;
      --pending-soft: rgba(251, 191, 36, 0.12);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171a;
    --surface: #1b1f23;
    --border: #2a2f34;
    --border-strong: #383e44;
    --text: #e8e9ea;
    --muted: #9198a1;
    --accent: #7c94ff;
    --accent-soft: rgba(124, 148, 255, 0.14);
    --mono-tag: #9198a1;
    --good: #4ade80;
    --good-soft: rgba(74, 222, 128, 0.12);
    --bad: #f87171;
    --bad-soft: rgba(248, 113, 113, 0.12);
    --pending: #fbbf24;
    --pending-soft: rgba(251, 191, 36, 0.12);

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 2rem 1.25rem 5rem;
    font-size: 15px;
    line-height: 1.5;
  }

  h1 {
    font-family: "Sora", "IBM Plex Sans", sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 0.2rem;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .subhead {
    color: var(--muted);
    font-size: 0.92rem;
    margin: 0 0 1.5rem;
  }

  .stage-tracker {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }

  .stage-pill {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.6rem 0.7rem;

    text-align: left;

  }

  .stage-pill:disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }

  .stage-pill.active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .stage-pill .num {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .stage-pill.active .num { color: var(--accent); }

  .stage-pill .label {
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 0.1rem;
    color: var(--text);
  }

  .stats-row {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.7rem 1rem;
    flex: 1;
    min-width: 100px;
  }

  .stat .value {
    font-family: "IBM Plex Mono", monospace;
    font-size: 1.35rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .stat.good .value { color: var(--good); }
  .stat.bad .value { color: var(--bad); }
  .stat.pending .value { color: var(--pending); }

  .stat .label {
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 0.1rem;
  }

  .toolbar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .search, .status-filter {
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    font-size: 0.9rem;
    font-family: inherit;
  }

  .search { flex: 1; }
  .status-filter { flex: 0 0 auto; }

  .search:focus, .status-filter:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }

  .job-list {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .job {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
  }

  .job-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .job-title {
    font-weight: 650;
    font-size: 1rem;
  }

  .job-company {
    color: var(--muted);
    font-weight: 500;
  }

  .job-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.35rem;
    font-size: 0.82rem;
    color: var(--muted);
    flex-wrap: wrap;
  }

  .tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--mono-tag);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0.1rem 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .job-meta a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }

  .job-meta a:hover { text-decoration: underline; }

  .found-via {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin-top: 0.5rem;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .term-chip {
    font-size: 0.74rem;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 0.08rem 0.55rem;
  }

  .verdict {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 0.6rem;
    font-size: 0.83rem;
  }

  .verdict-badge {
    font-weight: 700;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    flex-shrink: 0;
  }

  .verdict-badge.good { background: var(--good-soft); color: var(--good); }
  .verdict-badge.bad { background: var(--bad-soft); color: var(--bad); }
  .verdict-badge.pending { background: var(--pending-soft); color: var(--pending); }
  .verdict-badge.excluded { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }

  .verdict-reason {
    color: var(--muted);
    font-style: italic;
  }

  details summary {
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    list-style: none;
    margin-top: 0.55rem;
    user-select: none;
  }

  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }

  .desc {
    white-space: pre-wrap;
    font-size: 0.86rem;
    line-height: 1.55;

    padding: 0.75rem 0.9rem;
    margin-top: 0.5rem;
    max-height: 320px;
    overflow-y: auto;
  }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
  }

  #count-line {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }
</style>

s solutions to digitize, automate, and enable data-driven decision making for entire transportation networks; fixed-route buses, microtransit, paratransit, school buses, autonomous vehicles, and more.\n   \n\n  \n\n If you’re excited to be at the forefront of modernizing the future of transportation, are up for solving tough problems, and willing to become/already are a transit nerd, we are the place for you. Even if your past experience doesn’t align perfectly with every qualification in the job description for this role, we encourage you to apply. You may be just the right candidate for this or other opportunities.\n   \n\n  \n\n Ready to join the ride?\n   \n\n  \n\n*Via is an equal opportunity employer.*", "job_url": "https://www.linkedin.com/jobs/view/4404728967", "site": "linkedin", "date_posted": "", "search_terms": "ai engineer, data engineer, forward deployed engineer, software engineer, technical product manager", "stage2": {"status": "excluded_title", "reason": "Title filtered: senior", "min_years": null}}, {"title": "Software Engineer, SONiC", "company": "NVIDIA", "location": "Raanana, Center District, Israel", "description": "NVIDIA is looking for a creative and motivated Software Engineer to join our SONiC open source NOS team. Our team is responsible for the design and integration of SONiC across NVIDIA Networking products. In this role, you’ll have the opportunity to work on next-generation, high-speed networking solutions for AI data centers, contribute to open-source projects, and collaborate with experts across NVIDIA and the broader SONiC community.\n   \n\n  \n\n You’ll help lead the development of new SONiC networking features and chassis management capabilities across NVIDIA Networking products. We’re looking for someone who enjoys solving complex technical challenges, learning quickly, and collaborating in a dynamic and diverse team environment.\n   \n\n  \n\n**What You’ll Be Doing**\n* Design, integrate, and deliver new features as part of t  powers the future of AI and cloud infrastructure, we'd love to hear from you.\n\n\nNVIDIA is committed to fostering a diverse work environment and proud to be an equal opportunity employer. As we highly value diversity in our current and future employees, we do not discriminate (including in our hiring and promotion practices) on the basis of race, religion, color, national origin, gender, gender expression, sexual orientation, age, marital status, veteran status, disability status, or any other characteristic protected by law. Widely considered to be one of the technology world’s most desirable employers, NVIDIA offers highly competitive salaries and a comprehensive benefits package. As you plan your future, see what we can offer to you and your family www.nvidiabenefits.com/", "job_url": "https://il.indeed.com/viewjob?jk=094038a6bf3b900d", "site": "indeed", "date_posted": "2026-09-11", "search_terms": "ai engineer, data engineer, software engineer", "stage2": {"status": "excluded_title", "reason": "Title filtered: senior", "min_years": null}}, {"title": "Senior Edge-AI SoC Design Verification Engineer, Google Cloud", "company": "Google", "location": "תל אביב -יפו, TA, IL", "description": "Note: By applying to this position you will have an opportunity to share your preferred working location from the following: **Tel Aviv, Israel; Haifa, Israel**.### **Minimum qualifications:**\n\n* Bachelor's degree in Electrical Engineering or equivalent practical experience.\n* 8 years of experience with creating and using verification components and environments in standard verification methodology.\n* Experience verifying digital logic at RTL level using SystemVerilog or Specman/E for FPGAs or ASICs.\n\n  \n\n### **Preferred qualifications:**\n\n* Master's degree or PhD in Electrical Engineering, or a related field.\n* Experience with verification techniques, and the full verification life cycle.\n* Experience with Application-Specific Integrated Circuit (ASIC) standard interfaces and memory system architecture.\n* Experience with performance verification of ASICs and ASIC components.\n* Experience in four or more System on a Chip (SOC) cycles.\n\n**About the job**\n-----------------\n\n\nBe part of a team that pushes boundaries, developing custom silicon solutions that power the future of Google's direct-to-consumer products. You'll contribute to the innovation behind products loved by millions worldwide. Your expertise will shape the next generation of hardware experiences, delivering unparalleled performance, efficiency, and integration.\n\nIn this role, you will work as part of a Research and Development team. You will build verification components, constrained-random testing, system testing, and drive verification closure. You will verify digital designs, collaborate closely with design and verification engineers on projects, and perform direct verification. You will build constrained-random verification environments that exercise designs through their corner-cases and expose all types of bugs. You will manage the full life-cycle of verification, which can range from verification planning, test execution, to collecting and closing coverage.\n\n\nThe AI and Infrastructure team is redefining what’s possible. We empower Google customers with breakthrough capabilities and insights by delivering AI and Infrastructure at unparalleled scale, efficiency, reliability and velocity. Our customers include Googlers, Google Cloud customers, and billions of Google users worldwide.\n\n\nWe're the driving force behind Google's groundbreaking innovations, empowering the development of our cutting-edge AI models, delivering unparalleled computing power to global services, and providing the essential platforms that enable developers to build the future. From software to hardware our teams are shaping the future of world-leading hyperscale computing, with key teams working on the development of our TPUs, Vertex AI for Google Cloud, Google Global Networking, Data Center operations, systems research, and much more.\n\n**Responsibilities**\n--------------------\n\n* Plan the verification of digital design blocks by fully understanding the design specification and interacting with design engineers to identify important verification scenarios.\n* Create and enhance constrained-random verification environments using SystemVerilog and Universal Verification Methodology (UVM), or formally verify designs with SystemVerilog Assertions (SVA) and industry leading formal tools.\n* Identify and write all types of coverage measures for corner-cases.\n* Debug tests with design engineers to deliver functionally correct design blocks.\n* Close coverage measures to identify verification holes and to show progress towards tape-out.\nGoogle is proud to be an equal opportunity workplace and is an affirmative action employer. We are committed to equal employment opportunity regardless of race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability, gender identity or Veteran status. We also consider qualified applicants regardless of criminal histories, consistent with legal requirements. See also Google's EEO Policy and EEO is the Law. If you have a disability or special need that requires accommodation, please let us know by completing our Accommodations for Applicants form.", "job_url": "https://il.indeed.com/viewjob?jk=5eb907b4f1010886", "site": "indeed", "date_posted": "2026-09-10", "search_terms": "ai engineer, data engineer, software engineer", "stage2": {"status": "excluded_title", "reason": "Title filtered: senior", "min_years": null}}, {"title": "Channel Manager, EMEA & APAC", "company": "MEND", "location": "גבעתיים, TA, IL", "description": "**Why Mend.io**\n\n\nWe are redefining how modern organizations secure software from open source and custom code to AI-generated components. As the creators of the first AI Native AppSec Platform, we help global enterprises stay teractions to ensure seamless product functionality. - Define and evaluate feasibility tradeoffs in performance, timing, power, workloads, and area. - Explore and conceptualize novel approaches and next-generation architectural features. - Invent and define microarchitectures to achieve leadership in performance, power, area, and timing. - Propose and validate experimental and proof-of-concept design alternatives. - Review, challenge, and influence cross-functional roadmaps while setting technology targets. - Collaborate with platform design engineers to ensure hardware and software interfaces are complete and well-defined. - Mentor and develop technical leaders across the organization, fostering a strong engineering community. - Act as a change agent, role model Intel's values, and align organizational goals with technical vision.\n**Qualifications:**\n-------------------\n\nMinimum Qualifications - Bachelor's or BS degree in a specialized field of study, or equivalent experience. - 12 or more years of professional experience with a Bachelor's degree, 8 or more years with a Master's degree, or 6 or more years with a PhD. - Expertise in architecture definition, IP architecture development, and VLSI design principles. - Proficiency in solving complex problems and engineering tradeoffs involving performance, power, and area. - Deep understanding of transport protocols, including RDMA. - Experience with defining and delivering specifications for high-performance hardware-software integration. Preferred Qualifications - Demonstrated ability to influence and drive technical direction within an organization and across an industry. - Proven track record in conceptualizing and delivering next-generation architectural features. - Strong leadership skills with experience mentoring and growing technical leaders. - Effective collaboration and communication skills to work with cross-functional teams. - Passion for innovation and relentless execution in bringing products to marke e.**\n* ### **Take part in implementing and expanding our proprietary APIs, which are used by numerous enterprise clients.**\n* ### **Continuously develop and improve backend services supporting our existing web and mobile applications.**\n* ### **Take ownership of features throughout the entire software development lifecycle.**\n* ### **Collaborate with developers, QA engineers, product managers, and architects to deliver reliable, high-quality solutions.**\n* ### **Research and integrate cutting-edge technologies that improve the platform’s scalability, performance, and reliability.**\n* ### **Participate in code reviews and contribute to engineering standards and best practices.**\n\n### **Required Skills and Experience**\n\n* ### **B.Sc. in Computer Science, Software Engineering, or a related field.**\n* ### **5+ years of professional software development experience using Java.**\n* ### **Experience designing and developing REST APIs and backend services.**\n* ### **Experience developing SaaS products based on a microservices architecture.**\n* ### **Experience working with relational databases and SQL.**\n* ### **Experience with Docker, including containers, images, and Docker Compose.**\n* ### **Strong understanding of software design principles, clean code, and testing.**\n* ### **Strong problem-solving, communication, and collaboration skills.**\n\n### **Preferred Skills and Experience**\n\n* ### **Experience with AWS services, particularly S3 and EC2.**\n* ### **Experience with managed infrastructure services such as Redis, OpenSearch, and SQS.**\n* ### **Experience with Angular or React and CSS/SCSS.**\n* ### **Experience with Leaflet, Ionic, or Capacitor.**\n* ### **Experience with GIS systems or geospatial data.**\n* ### **Experience with CI/CD pipelines and cloud-based production environments.**\n\n  \n\nItron is committed to building an inclusive and diverse workforce and providing an authentic workplace experience for all employees. If you are excited about this role but your past experiences don't perfectly align with every requirement, we encourage you to apply anyway. In the end, you may be just who we are looking for!  \n\n  \n\nThe successful candidate's starting wage will be determined based on permissible, non-discriminatory factors such as skills and experience.  \n\n  \n\nItron is proud to be an Equal Opportunity Employer. If you require an accommodation to apply, please contact a recruiting representative at 1-800-635-5461 or email Accessibility@itron.com.\n\n  \n\nItron is transforming how the world manages energy, water and city services. Our trusted intelligent infrastructure solutions help utilities and cities improve efficiency, build resilience and deliver safe, reliable and affordable service. With edge intelligence, we connect people, data insights and devices so communities can better manage the essential resources they rely on to live. Join us as we create a more resourceful world: www.itron.com", "job_url": "https://il.indeed.com/viewjob?jk=74aee9ded02315ed", "site": "indeed", "date_posted": "2026-09-10", "search_terms": "data engineer, software engineer", "stage2": {"status": "excluded_title", "reason": "Title filtered: senior", "min_years": null}}, {"title": "Tel Aviv-Yafo, Tel Aviv District, Israel Engineering Manager", "company": "Guardz", "location": "יפו, TA, IL", "description": "#### **Tel Aviv-Yafo, Tel Aviv District, Israel**\n\n\nEstablished in 2022, Guardz rapidly emerged as a noteworthy player in the cybersecurity sphere, securing $85M in funding and rallying a dedicated team of 120 industry professionals. Our vision is to foster a safer digital landscape for small and medium businesses across the globe. To this end, we introduced our comprehensive all-in-one platform, and continue to grow and expand our team, our partnerships and our revenue.\n\n\nGuardz is looking for an Engineering Manager to lead one of our product engineering teams, building and scaling our cybersecurity platform.\n\n\nWe’re looking for a manager who is AI-first in mindset, comes from large-scale product environments, and knows how to translate product needs into scalable, reliable, and high-performing engineering solutions. You will operate in a fast-moving environment, driving execution while adapting quickly to change.\n\n\n**Responsibilities:**\n\n\n* Lead and develop a high-performing team of engineers, fostering ownership, accountability, and growth\n* Promote an AI-first engineering culture, leveraging modern tools to improve velocity and effectiveness\n* Drive delivery of customer-facing features with high standards for quality, performance, scalability, reliability, and speed\n* Identify performance and architectural bottlenecks and drive technical decisions that support future scale and efficient data processing\n* Partner closely with Product, Design, Security Research and other stakeholders to define priorities and deliver business impact\n* Stay close to the team’s technical work, contributing to design, architecture, and problem-solving when needed\n* Own team execution end-to-end, from planning and delivery to continuous improvement\n* Coach and mentor engineers, supporting their professional and career growth\n* Continuously improve development practices, including CI/CD, testing, and cloud infrastructure\n\n**Requirements:**\n\n\n* 5+ years of experience managing engineering teams\n* Proven experience building large-scale products serving a significant customer base\n* Strong experience with performance-sensitive systems with demanding reliability and SLA requirements\n* Strong system design and architectural experience, including performance, scale and data processing; experience with multi-tenant environments is a strong advantage\n* Strong product and business orientation, able to connect engineering decisions to customer and company impact\n* Proven adoption of AI-first development practices\n* Experience working in dynamic, fast-paced environments ce datasets, and working extensively with time-series forecasting, statistical modeling, and risk evaluation.\n* Partnering directly with domain experts and product leadership to continuously iterate on model architectures per business use-case.\n* Core Domain \\& Ecosystem- Data Science, Classical Machine Learning, Predictive Modeling, Time-Series Forecasting, Statistical Analysis (Regression, Survival Analysis, Bayesian Methods), Python, Feature Engineering, Financial Analytics / Quantitative Data.\n\n\n\n  \n\n\n\n\n\n**Requirements-**\n\n\n\n* 4+ years of professional experience as a Data Scientist within an established, hands-on Data Science group – Mandatory\n* Proven, hands-on track record building, tuning, and deploying Predictive Models into production environments – Mandatory\n* Deep expertise in Classical Machine Learning techniques and advanced statistical modeling (e.g., Regression, Time Series, Survival Analysis, Bayesian Methods) – Mandatory\n* Advanced programming and modeling mastery in Python – Mandatory\n* Strong quantitative academic background or solid foundation in Mathematics, Statistics, Computer Science, or a related quantitative field – Mandatory\n* Hands-on experience working with complex, messy real-world datasets and translating algorithmic outputs into tangible business impact – Mandatory\n* Prior background in elite technological military units or high-caliber R\\&D environments – Strong Advantage\n* Self-driven problem solver with a strong ownership mindset and a passion for early-stage engineering challenges – Mandatory\n\n\n\n  \n\n\n\n\n\n 154899", "job_url": "https://www.linkedin.com/jobs/view/4464299112", "site": "linkedin", "date_posted": "", "search_terms": "ai engineer, data scientist", "stage2": {"status": "gemini_no", "reason": "The posting explicitly mandates 4+ years of professional experience as a Data Scientist.", "min_years": 4}}, {"title": "Machine Learning Engineer", "company": "Gotfriends", "location": "Center Distri  consume GLM, Kimi, DeepSeek, Qwen, and MiniMax through Telnyx Inference (OpenAI-compatible API; there's no model infrastructure for you to run), or deploy self-hosted stacks (Llama, Mistral, and region-specific models like Hebrew-adapted LLMs or other sovereign models) behind your own serving engine when air-gapped or sovereign-cloud requirements demand it\n* Deploy and operate LiteLLM as the model gateway in customer environments: a unified OpenAI-compatible interface across self-hosted open-weight models and hosted providers, with routing, load balancing, retries and fallbacks, rate limits, and per-team virtual keys\n* Instrument and govern LLM usage through the gateway — cost tracking and budgets, caching, logging and observability (OpenTelemetry, Langfuse, or similar), and guardrails — so customers can see and control what their AI workloads are doing\n* Wire production observability for everything you ship — metrics, logs, traces, dashboards, and alerting (e.g. Prometheus + Grafana for metrics, OpenTelemetry for traces, Graylog or ELK for logs — or the customer's existing stack) — so you and the customer's ops team both know what \"healthy\" looks like and what pages whom when it isn't\n* Design model routing strategies for real-time voice workloads, balancing latency, cost, and quality, with sane fallback behavior when a provider degrades\n* Make the build-vs-buy case between self-hosted open-weight models and hosted frontier APIs, and keep the customer's application code portable across both\n* Adapt models to customer domains: prompt and RAG pipelines and evaluation harnesses for Hebrew and English language use cases and Israel-specific regulatory environments (Privacy Protection Law, data localization requirements, defense/security sector compliance)\n* Lead POCs, pilots, and production launches from whiteboard to go-live\n* Own customer outcomes — stay engaged until the solution is live and stable\n* Collaborate directly with Product and Engineering to shape the roadmap based on field insights from Israel\n* Create clear technical documentation, runbooks, and maintainable solutions for handoff\n* Troubleshoot and resolve complex integration issues alongside customer teams\n\n\n**What We're Looking For**\n* CS degree or equivalent experience\n* 3+ years building and shipping production software — you've written code that real users depended on, you've been on-call for it, and you've debugged it when things broke. (A consulting background counts if this is also true of you.)\n* Proficiency in multiple languages: Python, Node.js/TypeScript, Go — you're more dangerous in some than others. (Telnyx Edge Compute — functions and stateful actors — is TypeScript, so that one pulls double duty.)\n* Practical understanding of what breaks in front of a model in production: provider rate limits and quotas, timeout and retry behavior, streaming, token accounting and cost attribution, and the failure modes that only show up under concurrency\n* Comfortable deploying containerized services on Kubernetes, with secrets management, config, and upgrades as part of the deployment story\n* You've wired observability and been paged because of it — Prometheus + Grafana, OpenTelemetry, Graylog, ELK, or equivalent. You know what to monitor, what to alert on, and what \"healthy\" looks like\n* High-concurrency experience — Kafka, message queues, or event streams at real scale. When throughput spikes you know what breaks — consumer lag, backpressure, hot partitions, rebalance stalls — and what absorbs it: partitioning, consumer groups, parallelism up to your partition count\n* You've built APIs from scratch, not just consumed them — OpenAPI spec, REST/GraphQL design, auth, rate limiting, versioning, idempotency\n* Event-driven thinking and cloud-native instincts\n* Exposure to SIP, WebRTC, or real-time voice/messaging systems\n* Self-sufficient by default — there's no engineering team behind you. You read the code and the docs, ask the customer ars of hands-on software development experience strictly focused on Backend Engineering – Mandatory\n* Significant, production-grade development experience with Node.js and/or NestJS – Mandatory\n* Deep expertise in building high-scale distributed systems, microservices architectures, and Cloud environments (AWS/GCP) – Mandatory\n* Proven background in API design, asynchronous processing, event-driven architectures, and high-performance databases (SQL/NoSQL) – Mandatory\n* Strong leadership and mentoring capabilities with excellent cross-team communication skills – Mandatory", "job_url": "https://www.linkedin.com/jobs/view/4464265850", "site": "linkedin", "date_posted": "", "search_terms": "data engineer", "stage2": {"status": "gemini_no", "reason": "The posting explicitly requires 8 years of hands-on backend software development experience.", "min_years": 8}}, {"title": "Data Engineer - Cloud & SaaS Integrations", "company": "DoiT", "location": "תל אביב -יפו, TA, IL", "description": "**Location**  \n\nOur Data Engineer will be an integral part of our R\\&D team. This role is based remotely as a full-time employee in the UK, Ireland, Estonia, the Netherlands, Sweden and Israel. We are also open to contractors in Eastern Europe and Portugal.\n\n\n**Who We Are**  \n\nDoiT is a global technology company that works with cloud-driven organizations to leverage the cloud to drive business growth and innovation. We combine data, technology, and human expertise to ensure our customers operate in a well-architected and scalable state - from planning to production.\n\n\n\nDelivering DoiT Cloud Intelligence, the only solution that integrates advanced technology with human intelligence, we help our customers solve complex multicloud problems and drive efficiency.\n\n\n\nWith decades of multicloud experience, we have specializations in Kubernetes, GenAI, CloudOps, and more. An award-winning strategic partner of AWS, Google Cloud, and Microsoft Azure, we work alongside more than 4,000 customers worldwide.\n\n\n**The Opportunity**  \n\nCloud spend is no longer just AWS, Google Cloud and Azure. Our customers now run a large and growing share of their technology spend through SaaS platforms, data clouds and AI vendors - each with its own billing API, its own pricing model, and its own idea of what a \"line item\" means. DoiT's Integrations Framework is what turns that into a single, trustworthy picture of cost.\n\n\n\nWe're hiring a Data Engineer to own the data side of this. Your mandate is expanding visibility - bringing more of a customer's spend into the platform, from more vendors, at a quality bar people can make financial decisions on. The vendor landscape moves constantly, so this is genuine, permanent ownership with a short line from your work to what customers see.\n\n\n\nYou'll work AI-augmented from day one. We expect you to use AI across your whole workflow, not as an occasional autocomplete, and to have real opinions about where it earns its place.\n\n\n**Responsibilities**\n--------------------\n\n\n* **Expanding vendor coverage.** This is the core of the role. Build new integrations against third-party billing and usage APIs, and get more of our customers' spend visible in the platform. Keep existing integrations current as vendors change their APIs and pricing models - which they do constantly. Drive down the marginal cost of the next integration so coverage scales faster.\n* **Working AI-augmented.** Use AI daily across the full span of your work - exploring unfamiliar codebases and third-party APIs, prototyping approaches, generating and reviewing code, debugging, writing tests, and producing documentation. Push on what the tooling can do for this codebase, and bring judgement about where AI raises velocity and where a human still has to hold the quality bar.\n* **Data correctness and completeness.** Own the quality of the data our integrations produce: duplication, gaps, and race conditions in ingestion and reprocessing, deduplication of spend that also arrives via cloud marketplaces, and support for customers' negotiated rates rather than public list pricing. Build the checks and reconciliation that let us prove the numbers are right rather than hope they are.\n* **Normalization across vendors.** Design and build the models that make dozens of differently-shaped vendor bills comparable - consistent units, currencies, time granularity, resource and service taxonomies, and cost categories.\n* **Pipeline ownership.** Own the orchestration, scheduling, and backfill mechanics for ingestion pipelines end-to-end - including making backfills a routine, safe, self-service operation.\n* **Collaborating and problem-solving.** Work with product, support, and the engineers building on top of this data to understand where the gaps hurt. Propose work you think should happen; you're not here to wait for a spec.\n\n**Qualifications**\n------------------\n\n\n* 3+ years of professional experience in data engineering or a data-heavy backend role, with production ownership of pipelines that other people depend on\n* Strong **SQL** - you can write, read and reason about the performance of non-trivial analytical queries\n* Hands-on experience building and operating data pipelines with an orchestration framework. **Dagster or Airflow is highly desired**; equivalent experience with Prefect, dbt or a comparable tool is relevant if you're ready to work in Dagster/Airflow\n* Strong **Python**, or another language you use fluently for data work\n* Experience with a cloud data warehouse or analytical store (**BigQuery**, ClickHouse, Snowflake, Redshift or similar)\n* Experience integrating third-party REST APIs, including handling the realities: pagination, rate limits, partial failures, late-arriving and restated data, and vendors whose documentation is wrong\n* A real instinct for data correctness. You are the kind of engineer who reconciles totals, questions a number that looks plausible, and builds the assertion rather than assuming\n* **AI-augmented working style** - you already use AI tools across your engineering workflow and can talk concretely about what you've got out of them\n* Experience developing solutions in the cloud and/or using cloud services\n* Excellent communication skills in English, both written and verbal\n* Self-organized, goal-oriented and self-motivated; confident, thorough and tenacious\n\n**Bonus Points**\n----------------\n\n\n* Experience with **cloud or SaaS billing data** - AWS/GCP/Azure cost and usage exports, marketplace billing, or the FOCUS specification\n* Familiarity with **Go**, which we use across our backend services\n* Experience with systems that carry **financial or audit-grade correctness requirements** - invoicing, metering, revenue reconciliation, or billing engines\n* Exposure to FinOps practices or cloud financial management products\n* BA/BS degree or equivalent practical experience\n\n  \n\n\n**Are you a Do'er?**  \n\nBe your truest self. Work on your terms. Make a difference.\n\n\n\nWe are home to a global team of incredible talent who work remotely and have the flexibility to have a schedule that balances your work and home life. We embrace and support leveling up your skills professionally and personally.\n\n\n\nWhat does being a Do'er mean? We're all about being entrepreneurial, pursuing knowledge, and having fun! Click here to learn more about our core values.\n\n\n\nSounds too good to be true? Check out our Glassdoor Page.\n\n\n\nWe thought so too, but we're here and happy we hit that 'apply' button.\n\n\n\nFull-time employee benefits include:\n\n\n* Unlimited Vacation\n* Flexible Working Options\n* Health Insurance\n* Parental Leave\n* Employee Stock Option Plan\n* Home Office Allowance\n* Professional Development Stipend\n* Peer Recognition Program\n\n\n**Many Do'ers, One Team** DoiT unites as *Many Do'ers, One Team*, where diversity is more than a goal-it's our strength. We actively cultivate an inclusive, equitable workplace, recognizing that each unique perspective enhances our innovation. By celebrating differences, we create an environment where every individual feels valued, contributing to our collective success.\n\n\n\n#LI-Remote", "job_url": "https://il.indeed.com/viewjob?jk=062387eca08ca7b7", "site": "indeed", "date_posted": "2026-09-11", "search_terms": "ai engineer, data engineer", "stage2": {"status": "gemini_no", "reason": "The posting explicitly requires 3+ years of professional experience in data engineering.", "min_years": 3}}, {"title": "Senior Frontend Engineer", "company": "Itron", "location": "הרצליה, TA, IL", "description": "Itron is innovating new ways for utilities and cities to manage energy and water. We create a more resourceful world to protect essential resources for today and tomorrow. Join us.\n\n\nAt Itron, we're building the digital foundation for the next generation of utility infrastructure. Our Resiliency Solutions business helps the world's largest energy providers modernize how they plan, build, inspect, and operate the networks that power communities every day. As utilities invest hundreds of billions of dollars in grid modernization, storm hardening, renewable integration, and critical infrastructure expansion, we're creating the platform that connects the field, the office, and the enterprise in real time.\n\n\nJoining our team means becoming part of Locusview, Itron's fast-growing Resiliency Solutions business unit, a unique environment that combines the speed, innovation, and entrepreneurial spirit of a technology startup with the scale, resources, and global reach of an industry leader. This is more than a product opportunity; it's a chance to help shape a rapidly expanding platform at the center of one of the world's largest infrastructure transformations. As we continue to expand into new markets, workflows, technologies, and use cases, the opportunities to grow, innovate, and make a lasting impact are virtually limitless. For amb ial to being effective in this role.\n   \n\n  \n\n**What You'll Be Working On:**\n* End-to-end program delivery: Own multi-quarter release planning, dependency governance, and executive communication across the Managed Inference platform.\n* Complex, high-risk program management: Drive model version rollouts, inference optimization campaigns, SLA readiness for new GPU hardware, and multi-tenant capacity planning from kickoff through delivery.\n* Cross-functional alignment: Coordinate across Model Engineering, IaaS, Cloud Foundations, Data Center Operations, and external model providers to keep programs on track and unblocked.\n* Proactive risk identification: Surface risks across model serving, reliability, capacity constraints, and vendor timelines before they become program-level problems.\n* Execution frameworks and dashboards: Build lightweight, scalable TPM frameworks suited to Crusoe's pace; maintain real-time execution dashboards and deliver crisp, data-driven executive updates.\n* Phase 0 planning for model onboarding: Own pre-launch planning for model onboarding on new GPU generations, including firmware and driver readiness, CUDA and ROCm stack validation, and commissioning criteria for inference workloads.\n* Stakeholder leadership: Drive alignment and push back effectively across engineering, product, and operations leadership -- including highly technical stakeholders who have not previously worked with a TPM.\n\n\n**What You'll Bring to the Team:**\n* 7+ years of experience as a Technical Program Manager in fast-paced technical environments, with a track record of owning complex programs end-to-end across engineering and product organizations.\n* LLM inference and model serving knowledge: Working familiarity with batching strategies, quantization approaches, and the tradeoffs that govern latency, throughput, and cost at production scale.\n* Multi-tenant systems experience: Familiarity with isolation, quota management, and SLA enforcement across concur ng operating mechanisms, including forecasting, pipeline reviews, account planning, and business reviews.\n* Contribute ideas and feedback to broader commercial planning as Unity grows its strategic customer business across EMEA.\n\n### **What You’ll Be Doing**\n\n* Lead, coach, and develop a team of Client Partners to grow client relationships, strengthen commercial impact, and hit account goals.\n* Oversee a portfolio of strategic clients, focused on revenue growth, retention, expansion, and long-term partnership success.\n* Partner with Client Partners on account strategy, growth opportunities, and upsell/cross-sell across Unity's solutions.\n* Build and maintain team operating mechanisms - account planning and prioritization, forecasting, pipeline reviews, business reviews, and performance tracking.\n* Serve as an escalation point for client issues, removing roadblocks and driving timely resolution with internal teams.\n* Support onboarding, development, and performance skills, fostering accountability and continuous improvement.\n* Partner with leadership on team priorities, commercial planning, and ways to elevate the Client Partner function.\n\n**What we're looking for**\n\n* 5+ years of experience across mobile gaming, AdTech, or digital advertising, with hands-on knowledge of user acquisition growth strategies, monetization optimization, mediation, and LTV-driven decision-making.\n* Proven ability to connect client needs, product value, and commercial opportunities across a portfolio of accounts.\n* Demonstrated success as a trusted manager, with the ability to build strong relationships, influence stakeholders, and deliver measurable client and business impact.\n* Proven leadership experience, with the ability to coach, develop, and guide a team of Client Partners toward revenue, retention, and client success goals.\n* Ability to balance customer growth, team development, and operational effectiveness.\n* Strong communication and presentation skills, with ot pay fees to any third-party agency or company that does not have a signed agreement with Unity.*  \n\n  \n\n*Your privacy is important to us. Please take a moment to review our**Prospect* *and**Applicant* *Privacy Policies. Should you have any concerns about your privacy, please contact us at DPO@unity.com.*", "job_url": "https://il.indeed.com/viewjob?jk=85753c35b11ba210", "site": "indeed", "date_posted": "2026-09-11", "search_terms": "product manager", "stage2": {"status": "excluded_title", "reason": "Title filtered: manager", "min_years": null}}, {"title": "Enterprise Solutions Engineer, Israel", "company": "Postman", "location": "Tel Aviv District, Israel", "description": "**Who Are We?**\n Postman is the world’s leading API platform, used by more than 45 million+ developers and 500,000 organizations, including 98% of the Fortune 500. Postman is helping developers and professionals across the globe build the API-first world by simplifying each step of the API lifecycle and streamlining collaboration—enabling users to create better APIs, faster.\n   \n\n  \n\n The company is headquartered in San Francisco and has offices in Boston, New York, Austin, Tokyo, London, and Bangalore - where Postman was founded. Postman is privately held, with funding from Battery Ventures, BOND, Coatue, CRV, Insight Partners, and Nexus Venture Partners. Learn more at postman.com or connect with Postman on X via @getpostman.\n   \n\n  \n\n P.S: We highly recommend reading The \"API-First World\" graphic novel to understand the bigger picture and our vision at Postman.\n   \n\n  \n\n The Opportunity\n   \n\n  \n\n Postman is the world’s leading API platform, helping organizations across every industry collaboratively design, build, test, document, share, and manage their APIs.\n   \n\n  \n\n Our rocket continues to reach new heights, which is why we are looking for an experienced Solutions Engineer to support our rapidly growing enterprise customer base.\n   \n\n  \n\n As a Solutions tman’s impact in the world of APIs and beyond.\n\n\n**About You**\n We recognize that every candidate brings a unique set of experiences and strengths. The following requirements are meant as a guideline. If you believe you can make an impact in this role, we encourage you to apply even if your background does not match every qualification listed below.\n   \n\n  \n\n* 2+ years of experience in technical consulting, pre-sales engineering, or related roles.\n* 5+ years of experience in software engineering.\n* Expertise in one or more of the following:\n+ REST and GraphQL APIs\n+ API lifecycle management tools (e.g., Postman, Swagger/OpenAPI, Kong, Apigee)\n+ CI/CD and automation\n+ Cloud platforms (AWS, Azure, GCP)\n+ Modern software development practices\n\n* Excellent communication skills in English, with comfort in customer-facing presentations.\n* Ability to travel up to 25% across the region, with occasional global travel for company events.\n\n\n**What Else?**\n In addition to Postman's pay-on-performance philosophy, and a flexible schedule working with a fun, collaborative team, Postman offers a comprehensive set of benefits, including full medical coverage, flexible PTO, wellness reimbursement, and a monthly lunch stipend. Along with that, our wellness programs will help you stay in the best of your physical and mental health. Our frequent and fascinating team-building events will keep you connected, while our donation-matching program can support the causes you care about. We’re building a long-term company with an inclusive culture where everyone can be the best version of themselves.\n   \n\n  \n\n At Postman we value in person collaboration. We are in office 5 days a week for all roles based out of our hubs in San Francisco Bay Area, Boston, Austin, New York City, Tokyo and London. For roles based in Bangalore, employees currently work in the office three days a week and will transition to five days per week by the end of the year. We were thoughtful in and then immediately diving into the I2C/I3C bus topologies and PLDM command structures required to make it work, this role is for you.\n   \n\n  \n\n**What You'll Be Doing**\n* System Architecture \\& Flow Definition: Define and document comprehensive production, provisioning, update, recovery and reset flows for SmartNIC cards. Crucially, you will ensure that these board-level architectural decisions perfectly align with and support overarching platform-level needs, orchestrating seamless coordination between the NIC ASIC, BMC, CPU, and peripheral components.\n* Security \\& Provisioning: Specify security provisioning flows including OTP fusing, secure boot enablement, attestation key injection, certificate chain management, RPMC key derivation, and PQC (Post-Quantum Cryptography) requirements. Define IPN-to-OPN transition and component locking procedures.\n* Protocol Implementation \\& Guidance: Specify the use of standard management protocols (MCTP, PLDM, SPDM, NC-SI) across internal board interfaces to achieve secure boot, firmware updates, and telemetry gathering.\n* Hardware/Software Intersect: Dive deep into device-level hardware and software behaviour. Define CPLD logic requirements, power-sequencing dependencies, and reset orchestration (e.g., handling PCIe PERST#, SBR, and forced resets) for multi-host and standalone SmartNIC environments.\n* Interface Management: Architect intra-board communication pathways using PCIe, I2C/I3C, USB, and SPI, ensuring robust out-of-band (OOB) and in-band management connectivity.\n* Cross-Functional Leadership: Collaborate tightly with Production teams, Hardware and Firmware Engineering, NIC FW/Driver teams, and QA to translate your architectural specifications into implementable, testable realities.\n* Technical Documentation: Author rigorous technical specifications, test plans, and architectural design documents to guide both development and factory production.\n\n\n**What We Need To See**\n* Deep System-Level Perspecti   let stage = 'all';

  // Title-filter lens: derived from stage2.status. If status is 'excluded_title', the title
  // filter is what stopped it. Anything else (excluded_language, gemini_*, error) means the
  // pipeline got past the title filter, so by construction the title check passed.
  function titleVerdict(j) {
    if (j.stage2.status === 'excluded_title') {
      return { badge: 'excluded', label: 'Excluded', reason: j.stage2.reason };
    }
    return { badge: 'good', label: 'Passed', reason: 'Title check passed' };
  }

  const GEMINI_META = {
    gemini_no:  { label: 'Gemini: No',  badge: 'bad' },
    gemini_yes: { label: 'Gemini: Yes', badge: 'good' },
    error:      { label: 'Error',       badge: 'pending' },
  };

  const LENS_INFO = {
    all: {
      title: 'Scrape QA — All',
      subhead: 'One frozen JobSpy scrape, zero filtering applied — this is exactly what the scraper found.',
    },
    title: {
      title: 'Scrape QA — Regex on title',
      subhead: 'Only the title filter’s verdict — ignores language and Gemini entirely, so you can judge title matching in isolation.',
    },
    gemini: {
      title: 'Scrape QA — Gemini',
      subhead: 'Only jobs that reached Gemini (already past title + language filtering) — its verdict in isolation.',
    },
  };

  function setStage(s) {
    stage = s;
    document.getElementById('pill-all').classList.toggle('active', s === 'all');
    document.getElementById('pill-title').classList.toggle('active', s === 'title');
    document.getElementById('pill-gemini').classList.toggle('active', s === 'gemini');
    document.getElementById('page-title').textContent = LENS_INFO[s].title;
    document.getElementById('page-subhead').textContent = LENS_INFO[s].subhead;
    buildStatusFilter();
    renderStats();
    render(document.getElementById('search').value);
  }

  function buildStatusFilter() {
    const sel = document.getElementById('status-filter');
    sel.innerHTML = '';
    const opts = [['all', 'All']];
    if (stage === 'title') opts.push(['excluded', 'Excluded'], ['good', 'Passed']);
    if (stage === 'gemini') opts.push(['gemini_yes', 'Gemini: Yes'], ['gemini_no', 'Gemini: No'], ['error', 'Error']);
    for (const [value, label] of opts) {
      const opt = document.createElement('option');
      opt.value = value;
      opt.textContent = label;
      sel.appendChild(opt);
    }
    sel.value = 'all';
  }

  function geminiJobs() {
    return JOBS.filter(j => j.stage2.status === 'gemini_yes' || j.stage2.status === 'gemini_no' || j.stage2.status === 'error');
  }

  function renderStats() {
    const row = document.getElementById('stats-row');
    row.innerHTML = '';
    if (stage === 'all') {
      row.innerHTML = `
        <div class="stat"><div class="value">${JOBS.length}</div><div class="label">Jobs scraped</div></div>
        <div class="stat"><div class="value">${JOBS.filter(j => (j.site||'').toLowerCase()==='linkedin').length}</div><div class="label">LinkedIn</div></div>
        <div class="stat"><div class="value">${JOBS.filter(j => (j.site||'').toLowerCase()==='indeed').length}</div><div class="label">Indeed</div></div>
      `;
    } else if (stage === 'title') {
      const excluded = JOBS.filter(j => j.stage2.status === 'excluded_title').length;
      row.innerHTML = `
        <div class="stat bad"><div class="value">${excluded}</div><div class="label">Excluded</div></div>
        <div class="stat good"><div class="value">${JOBS.length - excluded}</div><div class="label">Passed</div></div>
      `;
    } else {
      const gj = geminiJobs();
      const counts = { gemini_yes: 0, gemini_no: 0, error: 0 };
      for (const j of gj) counts[j.stage2.status]++;
      row.innerHTML = `
        <div class="stat good"><div class="value">${counts.gemini_yes}</div><div class="label">Gemini: Yes</div></div>
        <div class="stat bad"><div class="value">${counts.gemini_no}</div><div class="label">Gemini: No</div></div>
        <div class="stat pending"><div class="value">${counts.error}</div><div class="label">Errors</div></div>
        <div class="stat"><div class="value">${gj.length}</div><div class="label">Reached Gemini</div></div>
      `;
    }
  }

  function render(filterText) {
    const list = document.getElementById('job-list');
    const empty = document.getElementById('empty-state');
    const countLine = document.getElementById('count-line');
    const q = (filterText || '').trim().toLowerCase();
    const statusFilter = document.getElementById('status-filter').value;

    const pool = stage === 'gemini' ? geminiJobs() : JOBS;

    const filtered = pool.filter(j => {
      if (q && !((j.title||'').toLowerCase().includes(q) || (j.company||'').toLowerCase().includes(q))) return false;
      if (stage === 'title' && statusFilter !== 'all') {
        const badge = titleVerdict(j).badge;
        if (statusFilter !== badge) return false;
      }
      if (stage === 'gemini' && statusFilter !== 'all' && j.stage2.status !== statusFilter) return false;
      return true;
    });

    countLine.textContent = `Showing ${filtered.length} of ${pool.length}`;
    list.innerHTML = '';
    empty.hidden = filtered.length > 0;

    for (const j of filtered) {
      const div = document.createElement('div');
      div.className = 'job';
      const site = (j.site || '').toLowerCase();
      let verdictHtml = '';
      if (stage === 'title') {
        const v = titleVerdict(j);
        verdictHtml = `
          <div class="verdict">
            <span class="verdict-badge ${v.badge}">${v.label}</span>
            <span class="verdict-reason">${escapeHtml(v.reason)}</span>
          </div>
        `;
      } else if (stage === 'gemini') {
        const meta = GEMINI_META[j.stage2.status];
        verdictHtml = `
          <div class="verdict">
            <span class="verdict-badge ${meta.badge}">${meta.label}</span>
            <span class="verdict-reason">${escapeHtml(j.stage2.reason)}</span>
          </div>
        `;
      }
      const foundVia = (j.search_terms || '').split(',').map(t => t.trim()).filter(Boolean);
      const foundViaHtml = foundVia.length
        ? `<div class="found-via">Found via: ${foundVia.map(t => `<span class="term-chip">${escapeHtml(t)}</span>`).join('')}</div>`
        : '';
      div.innerHTML = `
        <div class="job-head">
          <div class="job-title">${escapeHtml(j.title)} — <span class="job-company">${escapeHtml(j.company)}</span></div>
          <span class="tag">${escapeHtml(site)}</span>
        </div>
        <div class="job-meta">
          <span>${escapeHtml(j.location)}</span>
          <span>·</span>
          <span>${escapeHtml(j.date_posted)}</span>
          <span>·</span>
          <a href="${escapeAttr(j.job_url)}" target="_blank" rel="noopener">Open listing ↗</a>
        </div>
        ${foundViaHtml}
        ${verdictHtml}
        <details>
          <summary>Description</summary>
          <div class="desc">${escapeHtml(j.description)}</div>
        </details>
      `;
      list.appendChild(div);
    }
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  document.getElementById('search').addEventListener('input', e => render(e.target.value));
  document.getElementById('status-filter').addEventListener('change', () => render(document.getElementById('search').value));

  buildStatusFilter();
  renderStats();
  render('');
</script>
